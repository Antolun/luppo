build build-host="localhost" \
      commonflags="-mtune=generic -march=x86-64 -O2 -pipe -fstack-protector -D_FORTIFY_SOURCE=2 -g -fPIC" \
      cflags="-mtune=generic -march=x86-64 -O2 -pipe -fstack-protector -D_FORTIFY_SOURCE=2 -g -fPIC" \
      cxxflags="-mtune=generic -march=x86-64 -O2 -pipe -fstack-protector -D_FORTIFY_SOURCE=2 -g -fPIC" \
      host="x86_64-pc-linux-gnu" \
      cc="x86_64-pc-linux-gnu-gcc" \
      cxx="x86_64-pc-linux-gnu-g++" \
      compressionlevel=9 \
      enablesandbox=true \
      fallback="http://luppo.antolun.com" \
      generatedebug=false \
      jobs="-j5" \
      ldflags="-Wl,-O1 -Wl,-z,relro -Wl,--hash-style=gnu -Wl,--as-needed -Wl,--sort-common" \
      ignored-build-types="pae"

directories cache-root-dir="/var/cache/luppo" \
            archives-dir="/var/cache/luppo/archives" \
            cached-packages-dir="/var/cache/luppo/packages" \
            compiled-packages-dir="/var/cache/luppo/packages" \
            debug-packages-dir="/var/cache/luppo/packages-debug" \
            lib-dir="/var/lib/luppo" \
            history-dir="/var/lib/luppo/history" \
            index-dir="/var/lib/luppo/index" \
            info-dir="/var/lib/luppo/info" \
            kde-dir="/usr" \
            lock-dir="/run/lock/subsys" \
            log-dir="/var/log" \
            packages-dir="/var/lib/luppo/package" \
            qt-dir="/usr" \
            tmp-dir="/var/luppo"

general architecture="x86_64" \
        autoclean=false \
        bandwidth-limit=0 \
        destination-directory="/" \
        distribution="LupuS" \
        distribution-release="all" \
        distribution-id="all" \
        ignore-delta=false \
        ignore-safety=false \
        package-cache=true \
        package-cache-limit=0
