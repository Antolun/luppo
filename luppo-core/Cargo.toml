[package]
name = "luppo-core"
version = "4.0.0"
edition = "2024"

[dependencies]
sled = "0.34"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde-xml-rs = "0.7"
luppo-spec = { path = "../luppo-spec" }
tempfile = "3.8"

# Blocking reqwest (ASYNC DEĞİL)
reqwest = { version = "0.11", features = [
    "blocking",
    "rustls-tls",
], default-features = false }

xz2 = "0.1"
quick-xml = { version = "0.38", features = ["serialize"] }
chrono = { version = "0.4", features = ["serde"] }

thiserror = "1.0"
zstd = "0.13"

libc = "0.2"
tar = "0.4"
zip = "0.6"
rusqlite = "0.37.0"
indicatif = "0.17"
sha1 = "0.10.6"
sha2 = "0.10.8"
md5 = "0.7.0"
rayon = "1.8"
base64 = "0.13"
flate2 = "1.0"
petgraph = "0.6"
rust-i18n = "3.1"
zbus = { version = "4.3", features = ["blocking"] }
pubgrub = "0.4.0"
kdl = "6"
