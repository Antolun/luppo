[package]
name = "pisi"
version = "3.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
nix = { version = "0.27", features = ["user", "fs"] }
bincode = "1.3"
indicatif = "0.17"
serde-xml-rs = "0.7"
rayon = "1.8"
tempfile = "3.8"
rust-i18n = "3.1"
zip = "0.6"
xz2 = "0.1"
tar = "0.4"

pisi-core = { path = "../pisi-core" }
pisi-builder = { path = "../pisi-builder" }
pisi-spec = { path = "../pisi-spec" }

[features]
default = []
generate = ["dep:clap_complete", "dep:clap_mangen"]

[dependencies.clap_complete]
version = "4.4"
optional = true

[dependencies.clap_mangen]
version = "0.2"
optional = true

[[bin]]
name = "gen_man"
path = "src/bin/gen_man.rs"
required-features = ["generate"]

[[bin]]
name = "lspisi"
path = "src/bin/lspisi.rs"

[[bin]]
name = "unpisi"
path = "src/bin/unpisi.rs"

[[bin]]
name = "convert_kdl"
path = "src/bin/convert_kdl.rs"
